name: Pull Request Validation

on:
  pull_request:
    branches: [main]
    types: [opened, edited, synchronize, reopened, ready_for_review, converted_to_draft, labeled, unlabeled]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to recheck after a claim-only transition
        required: true
        type: number

concurrency:
  group: >-
    ${{ github.workflow }}-${{
      github.event.pull_request.number ||
      inputs.pr_number ||
      github.event.merge_group.head_sha ||
      github.ref
    }}-${{
      (github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
      !contains(fromJSON('["opened","synchronize","reopened"]'), github.event.action) &&
      !(github.event.action == 'edited' && github.event.changes.base != null))) &&
      'lifecycle' ||
      'validation'
    }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  # hv-agent-policy:start
  lifecycle:
    name: lifecycle
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'pull_request' ||
      github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: read
      pull-requests: read
      packages: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: oras-project/setup-oras@22ce207df3b08e061f537244349aac6ae1d214f6 # v1
      - name: Load pinned policy runtime
        env:
          POLICY_ARTIFACT: ${{ vars.AGENT_POLICY_ARTIFACT }}
        run: |
          case "$POLICY_ARTIFACT" in
            ghcr.io/*@sha256:*) ;;
            *) echo 'AGENT_POLICY_ARTIFACT must be an immutable GHCR digest' >&2; exit 1 ;;
          esac
          policy_dir="$RUNNER_TEMP/hv-policy"
          rm -rf "$policy_dir"
          mkdir -p "$policy_dir"
          oras pull "$POLICY_ARTIFACT" -o "$policy_dir"
          archive="$policy_dir/agent-policy.tar.gz"
          test -f "$archive" || { echo 'policy artifact is missing agent-policy.tar.gz' >&2; exit 1; }
          python3 - "$archive" <<'PY'
          import pathlib
          import sys
          import tarfile

          with tarfile.open(sys.argv[1], "r:gz") as archive:
              for member in archive.getmembers():
                  path = pathlib.PurePosixPath(member.name)
                  if path.is_absolute() or ".." in path.parts or member.issym() or member.islnk():
                      raise SystemExit(f"unsafe policy archive member: {member.name}")
          PY
          tar -xzf "$archive" -C "$policy_dir"
          echo "HV_POLICY_DIR=$policy_dir" >> "$GITHUB_ENV"
      - name: Validate lifecycle
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ inputs.pr_number || github.event.pull_request.number }}
          MERGE_GROUP_HEAD_SHA: ${{ github.event.merge_group.head_sha }}
          MERGE_GROUP_HEAD_REF: ${{ github.event.merge_group.head_ref }}
        run: |
          set -euo pipefail
          numbers_file="$RUNNER_TEMP/hv-agent-lifecycle-prs"
          "$HV_POLICY_DIR/scripts/hv-agent-lifecycle-prs" > "$numbers_file"
          while IFS= read -r number; do
            python3 "$HV_POLICY_DIR/scripts/hv-agent" check-pr "$number"
          done < "$numbers_file"
  # hv-agent-policy:end

  validate-commits:
    name: Validate Conventional Commits
    if: >-
      github.event_name == 'pull_request' &&
      (contains(fromJSON('["opened","synchronize","reopened"]'), github.event.action) ||
      (github.event.action == 'edited' && github.event.changes.base != null))
    runs-on: arc-happyvertical

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0

      - name: Validate commit messages
        uses: wagoid/commitlint-github-action@b948419dd99f3fd78a6548d48f94e3df7f6bf3ed # v6
        with:
          configFile: commitlint.config.mjs

      - name: Determine version bump
        id: version
        run: |
          commits=$(git log origin/main..HEAD --no-merges --pretty=format:"%s")

          bump="patch"
          if echo "$commits" | grep -qE "^feat(\(.+\))?!?:"; then
            bump="minor"
          fi

          if echo "$commits" | grep -qiE "(BREAKING CHANGE|!:)"; then
            bump="minor"  # Treat as minor until 1.0.0
          fi

          echo "bump=$bump" >> $GITHUB_OUTPUT
          echo "Will perform $bump version bump on merge"

      - name: Comment on PR
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const bump = '${{ steps.version.outputs.bump }}';

            const comment = `## Version Bump Preview

            When this PR is merged, @happyvertical/ocr will receive a **${bump}** version bump based on your conventional commits.

            ### What happens on merge?

            1. Tests run on main branch
            2. Package is built
            3. Version is bumped automatically
            4. Package is published to npm
            5. Git tag is created

            No manual intervention needed!`;

            // Check if we already commented
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number
            });

            const existingComment = comments.find(c =>
              c.user.login === 'github-actions[bot]' &&
              c.body.includes('Version Bump Preview')
            );

            if (existingComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existingComment.id,
                body: comment
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: comment
              });
            }

  test:
    name: Validate Changes
    if: >-
      github.event_name == 'merge_group' ||
      (github.event_name == 'pull_request' &&
      (contains(fromJSON('["opened","synchronize","reopened"]'), github.event.action) ||
      (github.event.action == 'edited' && github.event.changes.base != null)))
    uses: ./.github/workflows/test.yml
    secrets:
      HAVE_RELEASE_APP_ID: ${{ secrets.HAVE_RELEASE_APP_ID }}
      HAVE_RELEASE_APP_PRIVATE_KEY: ${{ secrets.HAVE_RELEASE_APP_PRIVATE_KEY }}

  required-ci:
    name: Required CI
    if: always()
    needs: [lifecycle, validate-commits, test]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read
    steps:
      - name: Verify or preserve required validation
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          BASE_CHANGED: ${{ github.event.changes.base != null }}
          PR_NUMBER: ${{ inputs.pr_number || github.event.pull_request.number }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
          LIFECYCLE: ${{ needs.lifecycle.result }}
          COMMITS: ${{ needs.validate-commits.result }}
          TEST: ${{ needs.test.result }}
        run: |
          set -euo pipefail
          require_success() {
            if [ "$2" != success ]; then
              echo "::error::$1 must succeed, got: $2"
              exit 1
            fi
          }

          require_success 'Lifecycle policy' "$LIFECYCLE"
          full_validation=false
          if [ "$EVENT_NAME" = merge_group ]; then
            full_validation=true
          elif [ "$EVENT_NAME" = pull_request ] && {
            [[ "$EVENT_ACTION" =~ ^(opened|synchronize|reopened)$ ]] ||
              { [ "$EVENT_ACTION" = edited ] && [ "$BASE_CHANGED" = true ]; }
          }; then
            full_validation=true
          fi

          if [ "$full_validation" = false ]; then
            head_sha="$EVENT_HEAD_SHA"
            if [ "$EVENT_NAME" = workflow_dispatch ]; then
              head_sha=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq .head.sha)
            fi
            latest=$(gh api "repos/$GITHUB_REPOSITORY/commits/$head_sha/check-runs?check_name=Required%20CI&filter=all&per_page=100" \
              --jq '[.check_runs[] | select(.name == "Required CI" and .status == "completed")] | sort_by(.completed_at) | reverse | .[0].conclusion // "missing"')
            if [ "$latest" != success ]; then
              echo "::error::Latest completed Required CI for $head_sha must pass, got: $latest"
              exit 1
            fi
            echo "Preserved the latest successful Required CI for $head_sha after lifecycle-only event."
            exit 0
          fi

          require_success 'Tests' "$TEST"
          if [ "$EVENT_NAME" = pull_request ]; then
            require_success 'Conventional commits' "$COMMITS"
          elif [ "$COMMITS" != skipped ]; then
            echo "::error::Conventional commits should be skipped for $EVENT_NAME, got: $COMMITS"
            exit 1
          fi
          echo "Required CI passed for $EVENT_NAME"
