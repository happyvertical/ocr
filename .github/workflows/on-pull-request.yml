name: Pull Request Validation

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  merge_group:
    types: [checks_requested]
concurrency:
  group: >-
    ${{ github.workflow }}-${{
      github.event.pull_request.number ||
      github.event.merge_group.head_sha ||
      github.ref
    }}-${{
      (github.event_name == 'pull_request' &&
      github.event.action == 'edited' &&
      github.event.changes.title != null &&
      github.event.changes.base == null) &&
      'title' ||
      (github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
      !contains(fromJSON('["opened","synchronize","reopened"]'), github.event.action) &&
      !(github.event.action == 'edited' && github.event.changes.base != null))) &&
      'lifecycle' ||
      'validation'
    }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:

  validate-commits:
    name: Validate Conventional Commits
    if: >-
      github.event_name == 'merge_group' ||
      (github.event_name == 'pull_request' &&
      contains(fromJSON('["opened","synchronize","reopened"]'), github.event.action))
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0

      - name: Validate commit messages
        uses: wagoid/commitlint-github-action@b948419dd99f3fd78a6548d48f94e3df7f6bf3ed # v6
        with:
          configFile: commitlint.config.mjs

      - name: Determine version bump
        id: version
        run: |
          commits=$(git log origin/main..HEAD --no-merges --pretty=format:"%s")

          bump="patch"
          if echo "$commits" | grep -qE "^feat(\(.+\))?!?:"; then
            bump="minor"
          fi

          if echo "$commits" | grep -qiE "(BREAKING CHANGE|!:)"; then
            bump="minor"  # Treat as minor until 1.0.0
          fi

          echo "bump=$bump" >> $GITHUB_OUTPUT
          echo "Will perform $bump version bump on merge"

      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const bump = '${{ steps.version.outputs.bump }}';

            const comment = `## Version Bump Preview

            When this PR is merged, @happyvertical/ocr will receive a **${bump}** version bump based on your conventional commits.

            ### What happens on merge?

            1. Tests run on main branch
            2. Package is built
            3. Version is bumped automatically
            4. Package is published to npm
            5. Git tag is created

            No manual intervention needed!`;

            // Check if we already commented
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number
            });

            const existingComment = comments.find(c =>
              c.user.login === 'github-actions[bot]' &&
              c.body.includes('Version Bump Preview')
            );

            if (existingComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existingComment.id,
                body: comment
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: comment
              });
            }

  test:
    name: Validate Changes
    if: >-
      github.event_name == 'merge_group' ||
      (github.event_name == 'pull_request' &&
      contains(fromJSON('["opened","synchronize","reopened"]'), github.event.action))
    uses: ./.github/workflows/test.yml
    secrets:
      HAVE_RELEASE_APP_ID: ${{ secrets.HAVE_RELEASE_APP_ID }}
      HAVE_RELEASE_APP_PRIVATE_KEY: ${{ secrets.HAVE_RELEASE_APP_PRIVATE_KEY }}

  required-ci:
    name: Required CI
    if: always()
    needs: [validate-commits, test]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require full validation success
        env:
          VALIDATE_COMMITS: ${{ needs.validate-commits.result }}
          TEST: ${{ needs.test.result }}
        run: |
          set -euo pipefail
          for result in "$VALIDATE_COMMITS" "$TEST"; do
            if [ "$result" != success ]; then
              echo "::error::full validation did not succeed: validate-commits=$VALIDATE_COMMITS test=$TEST"
              exit 1
            fi
          done
